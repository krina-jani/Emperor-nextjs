services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emperor-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
